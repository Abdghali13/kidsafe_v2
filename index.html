@keyframes ks-float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-6px) rotate(-2deg); }
}
@keyframes ks-bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-4px); }
}
@keyframes ks-pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.05); }
}
@keyframes ks-pulse-ring {
  0%   { box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
  70%  { box-shadow: 0 0 0 14px rgba(255,255,255,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
}
@keyframes ks-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes ks-sparkle {
  0%, 100% { opacity: 0; transform: scale(0.6) rotate(0deg); }
  50%      { opacity: 1; transform: scale(1) rotate(180deg); }
}
@keyframes ks-wobble {
  0%, 100%  { transform: rotate(0deg); }
  25%       { transform: rotate(-3deg); }
  75%       { transform: rotate(3deg); }
}
@keyframes ks-bounce-in {
  0%   { opacity: 0; transform: scale(0.6) translateY(30px); }
  60%  { opacity: 1; transform: scale(1.06) translateY(-4px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes ks-fade-up {
  0%   { opacity: 0; transform: translateY(16px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes ks-shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes ks-shine-sweep {
  0%   { transform: translateX(-100%) skewX(-20deg); }
  100% { transform: translateX(300%) skewX(-20deg); }
}
@keyframes ks-confetti {
  0%   { transform: translateY(-20vh) rotate(0deg) scale(0); opacity: 0; }
  10%  { opacity: 1; transform: translateY(0) rotate(45deg) scale(1); }
  100% { transform: translateY(120vh) rotate(720deg) scale(0.6); opacity: 0; }
}
@keyframes ks-mesh-shift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes ks-progress-flow {
  from { background-position: 0 0; }
  to   { background-position: 60px 0; }
}
@keyframes ks-success-tick {
  0%   { stroke-dashoffset: 24; }
  100% { stroke-dashoffset: 0; }
}
@keyframes ks-pop {
  0%   { transform: scale(0); }
  60%  { transform: scale(1.15); }
  100% { transform: scale(1); }
}
@keyframes ks-dot-pulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
  40%           { opacity: 1; transform: scale(1.3); }
}
@keyframes ks-blob-morph {
  0%, 100% { border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%; }
  33%      { border-radius: 50% 60% 40% 60% / 60% 40% 60% 40%; }
  66%      { border-radius: 40% 60% 60% 40% / 50% 50% 50% 50%; }
}

/* Ambient mesh background \u2014 animates color positions */
.ks-mesh-bg {
  background-size: 200% 200%;
  animation: ks-mesh-shift 18s ease-in-out infinite;
}

/* Bouncy press \u2014 apply on any clickable */
.ks-press {
  transition: transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
}
.ks-press:active {
  transform: scale(0.94);
}

/* Card hover lift */
.ks-lift {
  transition: transform 250ms cubic-bezier(0.32, 0.72, 0, 1),
              box-shadow 250ms cubic-bezier(0.32, 0.72, 0, 1);
}
.ks-lift:hover {
  transform: translateY(-3px);
}

/* Shine sweep \u2014 apply to a parent with overflow:hidden */
.ks-shine::after {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  transform: translateX(-100%) skewX(-20deg);
  pointer-events: none;
}
.ks-shine:hover::after {
  animation: ks-shine-sweep 700ms ease-out;
}

/* Floating accent (mascot, planets) */
.ks-float  { animation: ks-float 4s ease-in-out infinite; }
.ks-bob    { animation: ks-bob 2.4s ease-in-out infinite; }
.ks-pulse  { animation: ks-pulse 2s ease-in-out infinite; }
.ks-spin   { animation: ks-spin 8s linear infinite; }
.ks-wobble { animation: ks-wobble 1s ease-in-out; }
.ks-blob   { animation: ks-blob-morph 8s ease-in-out infinite; }

/* Stagger \u2014 combine with --i custom prop for entrance */
.ks-stagger > * {
  animation: ks-bounce-in 600ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  animation-delay: calc(var(--i, 0) * 60ms + 80ms);
}

/* Shimmer skeleton */
.ks-shimmer {
  background: linear-gradient(90deg, #EFEDE7 0%, #FAF8F4 50%, #EFEDE7 100%);
  background-size: 200% 100%;
  animation: ks-shimmer 1.4s linear infinite;
}

/* Time pill pulses gently */
.ks-pulse-time {
  animation: ks-pulse-ring 2.4s ease-out infinite;
}

/* Hide scrollbar inside iOS frame for a clean phone look */
.ks-ios-scroll::-webkit-scrollbar { display: none; }

/* Reduced motion \u2014 respect user preference */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
